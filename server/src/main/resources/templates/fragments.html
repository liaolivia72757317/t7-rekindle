<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · T7R 服务管理'">T7R 服务管理</title>
  <link rel="icon" th:href="@{/admin/assets/brand.ico}">
  <link rel="stylesheet" th:href="@{/admin/assets/vendor/tabler/1.6.1/tabler.min.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/ui-tokens.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/ui-tabler-adapter.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/admin.css}">
  <script defer th:src="@{/admin/assets/vendor/tabler/1.6.1/tabler.min.js}"></script>
  <script defer th:src="@{/admin/assets/ui-core.js}"></script>
  <script defer th:src="@{/admin/assets/admin.js}"></script>
  <th:block th:if="${title == '编辑公告'}">
    <link rel="stylesheet" th:href="@{/admin/assets/vendor/easymde/2.21.0/easymde.min.css}">
    <link rel="stylesheet" th:href="@{/admin/assets/announcement-editor.css}">
    <script defer th:src="@{/admin/assets/vendor/easymde/2.21.0/easymde.min.js}"></script>
    <script defer th:src="@{/admin/assets/announcement-preview.js}"></script>
    <script defer th:src="@{/admin/assets/announcement-editor.js}"></script>
  </th:block>
</head>
<body>
<th:block th:fragment="localTime(value, empty)">
  <time th:if="${value != null}" data-local-time th:attr="datetime=${value}" th:text="${value}"></time>
  <span th:unless="${value != null}" th:text="${empty}"></span>
</th:block>
<svg th:fragment="icon(name)" class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use th:href="@{/admin/assets/icons.svg} + '#' + ${name}"></use></svg>
<a th:fragment="brand" class="ui-brand navbar-brand" th:href="@{/admin}">
  <img th:src="@{/admin/assets/brand.ico}" width="32" height="32" alt="">
  <span>T7R <span class="admin-brand-label">服务管理</span></span>
</a>
<header class="ui-shell" th:fragment="managementNav(section)">
  <a class="admin-skip" href="#main-content">跳到主要内容</a>
  <div class="ui-topbar"><div class="ui-container">
    <a th:replace="~{fragments :: brand}"></a>
    <div class="ui-tools">
      <span class="ui-text-secondary admin-identity">管理员 / admin</span>
      <form th:action="@{/admin/logout}" method="post"><button class="btn ui-btn-secondary btn-sm" type="submit"><svg th:replace="~{fragments :: icon('logout')}"></svg><span>退出</span></button></form>
      <button class="btn ui-btn-secondary ui-icon-button admin-nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-expanded="false" aria-controls="main-navigation" aria-label="展开管理导航" title="展开管理导航"><svg th:replace="~{fragments :: icon('menu-2')}"></svg></button>
    </div>
  </div></div>
  <nav id="main-navigation" class="ui-mainnav collapse" aria-label="管理导航">
    <div class="ui-container ui-nav-row">
      <div class="admin-nav-links" id="primary-navigation">
        <a class="nav-link" data-nav-item th:href="@{/admin}" th:attr="aria-current=${section == 'home' ? 'page' : null}"><svg th:replace="~{fragments :: icon('inbox')}"></svg>首页</a>
        <div class="dropdown admin-nav-group" data-nav-item>
          <button id="nav-maintenance" class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-controls="nav-maintenance-items" th:classappend="${section == 'announcements' or section == 'qq-group' or section == 'titles' ? 'active' : ''}"><svg th:replace="~{fragments :: icon('speakerphone')}"></svg>服务维护</button>
          <div id="nav-maintenance-items" class="dropdown-menu" aria-labelledby="nav-maintenance">
            <a class="dropdown-item" th:href="@{/admin/announcements}" th:attr="aria-current=${section == 'announcements' ? 'page' : null}">公告管理</a>
            <a class="dropdown-item" th:href="@{/admin/qq-group}" th:attr="aria-current=${section == 'qq-group' ? 'page' : null}">QQ 群校验</a>
            <a class="dropdown-item" th:href="@{/admin/titles}" th:attr="aria-current=${section == 'titles' ? 'page' : null}">称号管理</a>
          </div>
        </div>
        <div class="dropdown admin-nav-group" data-nav-item>
          <button id="nav-players" class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-controls="nav-players-items" th:classappend="${section == 'accounts' or section == 'audit-player' ? 'active' : ''}"><svg th:replace="~{fragments :: icon('users')}"></svg>玩家管理</button>
          <div id="nav-players-items" class="dropdown-menu" aria-labelledby="nav-players">
            <a class="dropdown-item" th:href="@{/admin/accounts}" th:attr="aria-current=${section == 'accounts' ? 'page' : null}">账户与会话</a>
            <a class="dropdown-item" th:href="@{/admin/audit(scope=player)}" th:attr="aria-current=${section == 'audit-player' ? 'page' : null}">操作记录</a>
          </div>
        </div>
        <div class="dropdown admin-nav-group" data-nav-item>
          <button id="nav-system" class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-controls="nav-system-items" th:classappend="${section == 'password' or section == 'audit-system' ? 'active' : ''}"><svg th:replace="~{fragments :: icon('lock')}"></svg>系统管理</button>
          <div id="nav-system-items" class="dropdown-menu" aria-labelledby="nav-system">
            <a class="dropdown-item" th:href="@{/admin/password}" th:attr="aria-current=${section == 'password' ? 'page' : null}">管理员密码</a>
            <a class="dropdown-item" th:href="@{/admin/audit(scope=system)}" th:attr="aria-current=${section == 'audit-system' ? 'page' : null}">操作记录</a>
          </div>
        </div>
        <a class="nav-link" data-nav-item th:href="@{/admin/ui-components}" th:attr="aria-current=${section == 'ui-components' ? 'page' : null}"><svg th:replace="~{fragments :: icon('components')}"></svg>组件验收</a>
      </div>
    </div>
  </nav>
</header>
<nav th:fragment="breadcrumbs(group, parent, parentUrl, current)" class="admin-breadcrumb" aria-label="面包屑">
  <ol>
    <li th:if="${current != '首页'}"><a th:href="@{/admin}">首页</a></li>
    <li th:if="${group != null}" th:text="${group}"></li>
    <li th:if="${parent != null}"><a th:href="${parentUrl}" th:text="${parent}"></a></li>
    <li aria-current="page" th:text="${current}"></li>
  </ol>
</nav>
<header th:fragment="authHeader" class="ui-shell"><div class="ui-topbar"><div class="ui-container"><a th:replace="~{fragments :: brand}"></a></div></div></header>
<div th:fragment="error" th:if="${error != null}" class="alert alert-danger" role="alert" tabindex="-1" data-error-summary th:text="${error}"></div>
<th:block th:fragment="footer">
  <footer class="ui-container ui-footer">铁骑·重燃（T7-Rekindle）<span class="admin-footer-separator">·</span>服务管理</footer>
  <div id="ui-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="ui-toast-stack" class="ui-toast-stack" aria-label="操作通知"></div>
  <div class="modal ui-modal ui-modal--sm fade" id="ui-confirm" tabindex="-1" aria-labelledby="ui-confirm-title" aria-describedby="ui-confirm-message" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title" id="ui-confirm-title">确认操作</h2><button type="button" class="btn ui-icon-button ui-btn-secondary" data-bs-dismiss="modal" aria-label="关闭"><svg th:replace="~{fragments :: icon('x')}"></svg></button></div>
      <div class="modal-body" id="ui-confirm-message"></div>
      <div class="modal-footer"><button type="button" class="btn ui-btn-secondary" data-bs-dismiss="modal" id="ui-confirm-cancel">取消</button><button type="button" class="btn btn-danger" id="ui-confirm-accept">继续操作</button></div>
    </div></div>
  </div>
</th:block>
</body>
</html>
