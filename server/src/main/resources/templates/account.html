<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('账户详情')}"></head>
<body class="ui-scope">
<header th:replace="~{fragments :: managementNav('accounts')}"></header>
<main class="ui-container ui-main" id="main-content" tabindex="-1">
  <nav th:replace="~{fragments :: breadcrumbs('玩家管理', '账户与会话', @{/admin/accounts}, '账户详情')}"></nav>
  <a class="btn ui-btn-secondary admin-back" data-back-list th:href="@{/admin/accounts}">← 账户目录</a>
  <header class="ui-page-header"><div><h1 th:text="${account.loginName}" class="ui-page-title"></h1><code th:text="${account.accountId}"></code></div><span class="ui-status ui-status--info" th:text="${account.status == 'ACTIVE' ? '已启用' : '已禁用'}"></span></header>
  <section class="card admin-panel"><h2>游戏名称</h2>
    <div th:replace="~{fragments :: error}"></div>
    <p class="ui-text-secondary" th:if="${account.gameName == null}">尚未设置游戏名称，需补全注册。</p>
    <form th:action="@{/admin/accounts/{id}/game-name(id=${account.accountId})}" method="post" class="admin-form" data-dirty>
      <div class="admin-field"><label for="gameName" class="form-label">游戏名称</label>
        <input id="gameName" name="gameName" required maxlength="31" class="form-control" th:value="${editGameName != null ? editGameName : account.gameName}" aria-describedby="gameNameHelp">
        <span id="gameNameHelp" class="form-hint">全局唯一，区分大小写；最多 31 个 GBK 字节。启动器自动同步，已运行游戏下次启动生效。</span>
      </div><button class="btn btn-primary" type="submit">保存游戏名称</button>
    </form>
  </section>
  <section class="card admin-panel"><h2>账户操作</h2>
    <p><a th:href="@{/admin/accounts/{id}/titles(id=${account.accountId})}">管理称号 →</a></p>
    <div class="ui-actions">
      <form th:action="@{/admin/accounts/{id}/status(id=${account.accountId})}" method="post" th:attr="data-confirm-danger=${account.status == 'ACTIVE'}" data-confirm="确认更改账户状态？现有会话将失效。"><input type="hidden" name="enabled" th:value="${account.status != 'ACTIVE'}"><button type="submit" class="btn ui-btn-secondary" th:text="${account.status == 'ACTIVE' ? '禁用账户' : '启用账户'}"></button></form>
      <form th:if="${account.qqNumber == null}" th:action="@{/admin/accounts/{id}/password(id=${account.accountId})}" method="post" data-confirm="确认重置密码并撤销全部会话？新密码仅显示一次。"><button type="submit" class="btn ui-btn-secondary">生成新密码</button></form>
      <form th:action="@{/admin/accounts/{id}/sessions/revoke-all(id=${account.accountId})}" method="post" data-confirm="确认撤销全部会话？"><button type="submit" class="btn btn-outline-danger">撤销全部会话</button></form>
    </div>
  </section>
  <p class="ui-text-secondary" th:if="${account.qqNumber != null}" th:text="'QQ 扫码账号 · ' + ${account.nickname}"></p>
  <section class="card admin-panel"><h2>会话记录</h2><p class="ui-text-secondary">离线不代表凭证失效；QQ 异机登录会撤销旧会话。</p>
    <div class="ui-table-scroll" tabindex="0" aria-label="会话列表"><table class="table ui-table"><thead><tr><th scope="col">Session</th><th scope="col">凭证状态</th><th scope="col">在线状态</th><th scope="col">到期时间</th><th scope="col">在线租约</th><th scope="col">操作</th></tr></thead>
      <tbody><tr th:each="item : ${sessions}"><td><code th:text="${item.sessionId}"></code></td><td><span class="ui-status" th:text="${item.credentialState == 'VALID' ? '有效' : (item.credentialState == 'EXPIRED' ? '已过期' : '已撤销')}"></span></td><td><span class="ui-status" th:classappend="${item.online ? 'ui-status--success' : ''}" th:text="${item.online ? '在线' : '离线'}"></span></td><td class="admin-time"><th:block th:replace="~{fragments :: localTime(${item.expiresAt}, '—')}"></th:block></td><td class="admin-time"><th:block th:replace="~{fragments :: localTime(${item.leaseExpiresAt}, '—')}"></th:block></td><td><form th:if="${item.credentialState == 'VALID'}" th:action="@{/admin/accounts/{id}/sessions/{sessionId}/revoke(id=${account.accountId},sessionId=${item.sessionId})}" method="post" data-confirm="确认撤销此会话？"><button type="submit" class="btn btn-link admin-danger-link">撤销</button></form></td></tr>
      <tr th:if="${sessions.isEmpty()}"><td colspan="6" class="ui-empty">暂无会话。</td></tr></tbody></table></div>
    <nav class="ui-pagination" aria-label="会话分页"><span class="admin-page-count" th:text="'本页 ' + ${sessions.size()} + ' 条'"></span><a class="btn ui-btn-secondary btn-sm" th:if="${page > 0}" th:href="@{/admin/accounts/{id}(id=${account.accountId},page=${page - 1})}">上一页</a><span th:text="'第 ' + (${page} + 1) + ' 页'"></span><a class="btn ui-btn-secondary btn-sm" th:if="${sessions.size() == 50}" th:href="@{/admin/accounts/{id}(id=${account.accountId},page=${page + 1})}">下一页</a></nav>
  </section>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
