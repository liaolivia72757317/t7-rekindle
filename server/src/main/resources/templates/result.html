<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('一次性密码')}"></head>
<body class="ui-scope">
<header th:replace="~{fragments :: managementNav('accounts')}"></header>
<main class="ui-container ui-main" id="main-content" tabindex="-1">
  <nav th:replace="~{fragments :: breadcrumbs('玩家管理', '账户与会话', @{/admin/accounts}, '一次性密码')}"></nav>
  <header class="ui-page-header"><div><h1 class="ui-page-title">一次性密码</h1></div></header>
  <section class="card admin-panel" th:if="${result != null}"><h2>操作成功</h2><p>请保存密码，离开或刷新后不再显示。</p><dl><dt>登录名</dt><dd th:text="${result.loginName}"></dd><dt>新密码</dt><dd><code class="admin-secret" data-secret th:text="${result.password}"></code></dd></dl></section>
  <section class="card admin-panel" th:unless="${result != null}"><h2>密码已显示或结果已过期</h2><p>未保存密码时，请回到账户详情重新生成。</p></section>
  <a class="btn ui-btn-secondary admin-back" th:href="@{/admin/accounts}">返回账户目录 →</a>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
