<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${auditTitle})}"></head>
<body class="ui-scope">
<header th:replace="~{fragments :: managementNav(${auditSection})}"></header>
<main class="ui-container ui-main" id="main-content" data-list="audit" tabindex="-1">
  <nav th:replace="~{fragments :: breadcrumbs(${auditGroup}, null, null, '操作记录')}"></nav>
  <header class="ui-page-header"><div><h1 class="ui-page-title" th:text="${auditTitle}"></h1></div></header>
  <section class="card admin-panel"><div class="ui-table-scroll" tabindex="0" aria-label="操作记录"><table class="table ui-table"><thead><tr><th scope="col">时间</th><th scope="col">操作者</th><th scope="col">动作</th><th scope="col">对象</th></tr></thead><tbody>
    <tr th:each="item : ${records}"><td class="admin-time"><th:block th:replace="~{fragments :: localTime(${item.createdAt}, '—')}"></th:block></td><td><code th:text="${item.actor}"></code></td><td><code th:text="${item.action}"></code></td><td><code th:text="${item.target}"></code></td></tr>
    <tr th:if="${records.isEmpty()}"><td colspan="4" class="ui-empty">暂无操作记录。</td></tr></tbody></table></div>
    <nav class="ui-pagination" aria-label="记录分页"><span class="admin-page-count" th:text="'本页 ' + ${records.size()} + ' 条'"></span><a class="btn ui-btn-secondary btn-sm" th:if="${page > 0}" th:href="@{/admin/audit(page=${page - 1})}">上一页</a><span th:text="'第 ' + (${page} + 1) + ' 页'"></span><a class="btn ui-btn-secondary btn-sm" th:if="${records.size() == 50}" th:href="@{/admin/audit(page=${page + 1})}">下一页</a></nav>
  </section>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
