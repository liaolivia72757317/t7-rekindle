<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('管理员密码')}"></head>
<body class="shell">
<aside th:replace="~{fragments :: nav('password')}"></aside>
<main class="content">
  <header class="page-header"><div><p class="eyebrow">身份与访问</p><h1>管理员密码</h1></div></header>
  <section class="panel narrow">
    <p class="notice" th:if="${mustChange}" role="status">请先替换初始密码，再使用账户管理功能。</p>
    <p class="muted">修改后所有管理员会话退出，需要重新登录。普通账户不受影响。</p>
    <form th:action="@{/admin/password}" method="post" class="stack">
      <label for="oldPassword">当前密码</label><input id="oldPassword" name="oldPassword" type="password" required minlength="8" maxlength="128" autocomplete="current-password">
      <label for="newPassword">新密码</label><input id="newPassword" name="newPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="passwordHelp">
      <span class="footnote" id="passwordHelp">8–128 个字符，与当前密码不同。空格按原样保留。</span>
      <label for="confirmation">确认新密码</label><input id="confirmation" name="confirmation" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
      <button type="submit">修改密码并退出</button>
    </form>
  </section>
</main>
</body>
</html>
