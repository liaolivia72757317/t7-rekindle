<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('管理员密码')}"></head>
<body class="ui-scope">
<header th:replace="~{fragments :: managementNav('password')}"></header>
<main class="ui-container ui-main" id="main-content" tabindex="-1">
  <nav th:replace="~{fragments :: breadcrumbs('系统管理', null, null, '管理员密码')}"></nav>
  <header class="ui-page-header"><div><h1 class="ui-page-title">管理员密码</h1></div></header>
  <section class="card admin-panel">
    <div th:replace="~{fragments :: error}"></div>
    <p class="alert alert-warning" th:if="${mustChange}" role="status">请先修改初始密码。</p>
    <p class="ui-text-secondary">修改后所有管理员需重新登录。</p>
    <form th:action="@{/admin/password}" method="post" class="admin-form" data-dirty>
      <div class="admin-field"><label for="oldPassword" class="form-label">当前密码 <span aria-hidden="true">*</span></label><input id="oldPassword" name="oldPassword" type="password" required minlength="8" maxlength="128" autocomplete="current-password" class="form-control">
      </div>
      <div class="admin-field"><label for="newPassword" class="form-label">新密码 <span aria-hidden="true">*</span></label><input id="newPassword" name="newPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="passwordHelp" class="form-control">
      <span class="form-hint" id="passwordHelp">8–128 个字符，与当前密码不同。空格按原样保留。</span>
      </div>
      <div class="admin-field"><label for="confirmation" class="form-label">确认新密码 <span aria-hidden="true">*</span></label><input id="confirmation" data-match="newPassword" name="confirmation" type="password" required minlength="8" maxlength="128" autocomplete="new-password" class="form-control">
      </div>
      <div class="ui-form-actions"><button type="submit" class="btn btn-primary">修改密码并退出</button></div>
    </form>
  </section>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
