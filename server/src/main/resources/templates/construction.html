<!doctype html>

<head th:replace="~{fragments :: head(${auditTitle})}"></head>

  <header class="ui-page-header"><h1 class="ui-page-title" th:text="${auditTitle}"></h1></header>
  <section class="card admin-panel">

<th:block th:replace="~{fragments :: footer}"></th:block>

</html>
