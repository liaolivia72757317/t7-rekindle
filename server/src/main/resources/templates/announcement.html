<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('编辑公告')}"></head>
<body class="ui-scope">
<header th:replace="~{fragments :: managementNav('announcements')}"></header>
<main class="ui-container ui-main" id="main-content" tabindex="-1">
  <nav th:replace="~{fragments :: breadcrumbs('服务维护', '公告管理', @{/admin/announcements}, ${entry == null ? '新建公告' : '编辑公告'})}"></nav>
  <a class="btn ui-btn-secondary admin-back" data-back-list th:href="@{/admin/announcements}">← 公告列表</a>
  <header class="ui-page-header"><div><h1 th:text="${entry == null ? '新建公告' : '编辑公告'}" class="ui-page-title"></h1></div><span th:if="${entry != null}" class="ui-status ui-status--info" th:text="${entry.enabled ? '已发布' : (entry.publishedAt == null ? '草稿' : '已下线')}"></span></header>
  <p class="alert alert-success" role="status" th:if="${param.saved}">草稿已保存，线上内容保持不变。</p>
  <p class="alert alert-success" role="status" th:if="${param.published}">公告已发布。</p>
  <p class="alert alert-success" role="status" th:if="${param.unpublished}">公告已下线。</p>
  <section class="card admin-panel">
    <h2>编辑稿</h2>
    <p class="alert alert-danger" tabindex="-1" data-error-summary role="alert" th:if="${error != null}" th:text="${error}"></p>
    <p class="ui-text-secondary">保存草稿不影响线上内容，发布后生效。</p>
    <form th:action="${entry == null} ? @{/admin/announcements} : @{/admin/announcements/{id}(id=${entry.announcementId})}" method="post" class="admin-form" data-dirty data-async>
      <div class="admin-field"><label for="title" class="form-label">标题 <span aria-hidden="true">*</span></label><input id="title" name="title" th:value="${draft.title}" required th:maxlength="${titleLimit}" class="form-control">
      </div>
      <div class="admin-field"><label for="summary" class="form-label">摘要 <span aria-hidden="true">*</span></label><textarea id="summary" name="summary" rows="3" required th:maxlength="${summaryLimit}" th:text="${draft.summary}" aria-describedby="summaryHelp" class="form-control"></textarea>
      <span class="form-hint" id="summaryHelp" th:text="'纯文本，最多 ' + ${summaryLimit} + ' 个字符。'"></span>
      </div>
      <div class="admin-field"><label for="bodyMarkdown" class="form-label">正文（Markdown） <span aria-hidden="true">*</span></label><textarea id="bodyMarkdown" name="bodyMarkdown" rows="16" required th:maxlength="${bodyLimit}" th:text="${draft.bodyMarkdown}" aria-describedby="markdownHelp" class="form-control ui-code" data-markdown-editor></textarea>
      <span class="form-hint" id="markdownHelp" th:text="'最多 ' + ${bodyLimit} + ' 个字符；支持标题、段落、列表、粗体、斜体和行内代码。HTML、图片与链接按文本展示。'"></span>
      </div>
      <div class="ui-form-actions"><button type="submit" class="btn" th:classappend="${entry == null ? 'btn-primary' : 'ui-btn-secondary'}">保存草稿</button><button th:if="${entry != null}" type="submit" th:formaction="@{/admin/announcements/{id}/publish(id=${entry.announcementId})}" data-confirm-danger="false" data-confirm="确认发布当前表单内容？此公告将成为首页最新公告。" class="btn btn-primary">发布公告</button></div>
    </form>

  </section>
  <section class="card admin-panel" th:if="${entry != null && entry.publishedAt != null}"><h2>发布状态</h2><p class="ui-text-secondary">最近发布：<th:block th:replace="~{fragments :: localTime(${entry.publishedAt}, '—')}"></th:block></p>
    <form th:if="${entry.enabled}" th:action="@{/admin/announcements/{id}/unpublish(id=${entry.announcementId})}" method="post" data-confirm="确认下线此公告？草稿与发布内容会保留。"><button type="submit" class="btn btn-outline-danger">下线公告</button></form>
  </section>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
