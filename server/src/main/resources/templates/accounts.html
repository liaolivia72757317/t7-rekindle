<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('账户与会话')}"></head>
<body class="ui-scope">
<header th:replace="~{fragments :: managementNav('accounts')}"></header>
<main class="ui-container ui-main" id="main-content" data-list="accounts" tabindex="-1">
  <nav th:replace="~{fragments :: breadcrumbs('玩家管理', null, null, '账户与会话')}"></nav>
  <header class="ui-page-header"><div><h1 class="ui-page-title">账户与会话</h1></div><div class="ui-actions"><span class="ui-status ui-status--info">30 天固定有效期</span><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#account-create">创建账户</button></div></header>
  <section class="card admin-panel">
    <form th:action="@{/admin/accounts}" method="get" class="admin-toolbar">
      <div class="admin-field"><label for="query" class="form-label">按登录名前缀查找</label><input id="query" name="query" th:value="${query}" maxlength="64" placeholder="例如 player" class="form-control"></div>
      <button class="btn btn-primary" type="submit">查询</button><a class="btn ui-btn-secondary" th:href="@{/admin/accounts}">重置</a>
    </form>
    <div class="ui-table-scroll" tabindex="0" aria-label="账户列表">
      <table class="table ui-table"><thead><tr><th scope="col">登录名</th><th scope="col">游戏名称 / QQ 名称</th><th scope="col">账户状态</th><th scope="col">在线状态</th><th scope="col">最近心跳</th><th scope="col" th:if="${groupChecksEnabled}">最近入群检测</th><th scope="col">创建时间</th><th scope="col">管理</th></tr></thead>
        <tbody><tr th:each="item : ${accounts}">
          <td><strong th:text="${item.loginName}"></strong><code class="admin-subline" th:text="${item.accountId}"></code></td>
          <td><strong th:text="${item.gameName != null ? item.gameName : '待补全注册'}"></strong><span class="admin-subline" th:text="${item.nickname}"></span></td>
          <td><span class="ui-status" th:classappend="${item.status == 'ACTIVE' ? 'ui-status--success' : ''}" th:text="${item.status == 'ACTIVE' ? '已启用' : '已禁用'}"></span></td>
          <td><span class="ui-status" th:classappend="${item.online ? 'ui-status--success' : ''}" th:text="${item.online ? '在线' : '离线'}"></span></td>
          <td class="admin-time"><th:block th:replace="~{fragments :: localTime(${item.lastHeartbeatAt}, '—')}"></th:block></td>
          <td th:if="${groupChecksEnabled}"><span class="admin-time"><th:block th:replace="~{fragments :: localTime(${item.qqNumber == null ? null : item.groupCheckedAt}, ${item.qqNumber == null ? '不适用' : '尚未检测'})}"></th:block></span>
            <span th:if="${item.groupCheckResult != null}" class="ui-status admin-subline" th:classappend="${item.groupCheckResult == 'MEMBER' ? 'ui-status--success' : 'ui-status--danger'}"
                  th:text="${item.groupCheckResult == 'MEMBER' ? '已入群' : (item.groupCheckResult == 'NOT_MEMBER' ? '未入群' : '查询失败')}"></span></td>
          <td class="admin-time"><th:block th:replace="~{fragments :: localTime(${item.createdAt}, '—')}"></th:block></td><td><a th:href="@{/admin/accounts/{id}(id=${item.accountId})}">查看详情 →</a></td>
        </tr>
        <tr th:if="${accounts.isEmpty()}"><td th:attr="colspan=${groupChecksEnabled ? 8 : 7}" class="ui-empty">没有匹配账户。</td></tr></tbody>
      </table>
    </div>
    <nav class="ui-pagination" aria-label="账户分页"><span class="admin-page-count" th:text="'本页 ' + ${accounts.size()} + ' 条'"></span><a class="btn ui-btn-secondary btn-sm" th:if="${page > 0}" th:href="@{/admin/accounts(query=${query},page=${page - 1})}">上一页</a><span th:text="'第 ' + (${page} + 1) + ' 页'"></span><a class="btn ui-btn-secondary btn-sm" th:if="${accounts.size() == 50}" th:href="@{/admin/accounts(query=${query},page=${page + 1})}">下一页</a></nav>
  </section>
  <div class="modal ui-modal fade" id="account-create" tabindex="-1" aria-labelledby="account-create-label" data-form-modal data-bs-backdrop="static" th:attr="data-modal-auto=${error != null}">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title" id="account-create-label" th:text="'创建普通账户'"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
      <div class="modal-body">
<div th:replace="~{fragments :: error}"></div><p class="ui-text-secondary">随机密码仅显示一次。</p>
    <form th:action="@{/admin/accounts}" method="post" class="admin-form" data-dirty><div class="admin-field"><label for="newLoginName" class="form-label">登录名 <span aria-hidden="true">*</span></label><input id="newLoginName" name="loginName" th:value="${createLoginName}" required minlength="3" maxlength="64" pattern="(?![0-9]+$)[a-z0-9_.\-]{3,64}" autocomplete="off" aria-describedby="nameHelp" class="form-control"><span class="form-hint" id="nameHelp">3–64 位小写字母、数字或 _ . -，纯数字保留给 QQ 账号</span></div><div class="admin-field"><label for="newGameName" class="form-label">游戏名称 <span aria-hidden="true">*</span></label><input id="newGameName" name="gameName" th:value="${createGameName}" required maxlength="31" class="form-control"><span class="form-hint">全局唯一，区分大小写，最多 31 个 GBK 字节</span></div><button type="submit" class="btn btn-primary">创建账户</button></form>

      </div>
      <div class="modal-footer"><button type="button" class="btn ui-btn-secondary" data-bs-dismiss="modal">关闭</button></div>
    </div></div>
  </div>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
