name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: pwsh

env:
  T7R_SERVER_BASE_URL: ${{ vars.T7R_SERVER_BASE_URL }}
  T7R_PREVIEW_ACCESS_PUBLIC_KEY: ${{ vars.T7R_PREVIEW_ACCESS_PUBLIC_KEY }}
  PYTHONUTF8: "1"

jobs:
  build:
    name: Windows x64 / Release
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      installer_id: ${{ steps.installer.outputs.artifact-id }}
      portable_id: ${{ steps.portable.outputs.artifact-id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up CPython
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          architecture: x64

      - name: Configure release version and update mirror
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          T7R_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/release_metadata.py prepare-build

      - name: Set up Inno Setup 7.1.0
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          $innoDirectory = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
          $arguments = @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/CURRENTUSER", "/PORTABLE=1", "/NOICONS", "/DIR=`"$innoDirectory`""
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup preparation failed with exit code $($process.ExitCode)"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $innoDirectory -Encoding utf8

      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1

      - name: Run Python tests
        run: python -m pytest -q tests/python --junitxml=artifacts/test-results/python.xml

      - name: Build and test native projects
        run: python scripts/build.py --project native-tests

      - name: Install pinned Rust toolchain
        working-directory: src/BattleRust
        run: rustup show

      - name: Test Rust runtime and gateway
        run: |
          python scripts/build.py --project rust-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build.py --project rust-bridge-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build.py --project rust-gateway-tests

      - name: Build managed projects
        run: python scripts/build.py --project managed

      - name: Run managed tests
        timeout-minutes: 5
        run: .\artifacts\bin\T7R.ManagedHarness\x64\Release\net48\T7R.ManagedHarness.exe

      - name: Validate published preview authorization key
        if: >-
          github.ref_type == 'tag' ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        run: .\artifacts\bin\T7R.ManagedHarness\x64\Release\net48\T7R.ManagedHarness.exe --preview-key-check

      - name: Run synthetic integration tests
        run: python scripts/integration_test.py --report artifacts/test-results/integration.json

      - name: Package application
        run: >-
          python scripts/package.py --output artifacts/package
          --release

      - name: Verify package
        run: python scripts/package.py --output artifacts/package --verify --release

      - name: Verify packaged native bindings
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "t7r-native-contract-state"
          .\artifacts\bin\T7R.ManagedHarness\x64\Release\net48\T7R.ManagedHarness.exe --native-contract-tests artifacts/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\artifacts\bin\T7R.ManagedHarness\x64\Release\net48\T7R.ManagedHarness.exe --offline-battle-contract-tests artifacts/package/T7R.NativeBridge.dll artifacts/package/t7r_battle_ffi.dll

      - name: Create portable release archive
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "artifacts/package/*" `
            -DestinationPath "dist/T7-Rekindle-windows-x64.zip"

      - name: Build installer
        run: |
          $arguments = @("--messages-jsonl")
          $arguments += "--define=MyAppVersion=$env:T7R_BUILD_VERSION"
          $arguments += "installer/T7-Rekindle.iss"
          $messages = "artifacts/test-results/inno.jsonl"
          & "$env:RUNNER_TEMP/InnoSetup/ISCC.exe" @arguments 2> $messages
          $compilerExitCode = $LASTEXITCODE
          Get-Content -Encoding UTF8 -LiteralPath $messages
          if ($compilerExitCode -ne 0) { exit $compilerExitCode }
          if (Select-String -LiteralPath $messages -Pattern '"severity"\s*:\s*"warning"' -Quiet) {
            throw "Inno Setup reported compiler warnings."
          }

      - name: Upload application package
        uses: actions/upload-artifact@v7
        with:
          name: T7-Rekindle-windows-x64
          overwrite: true
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: T7-Rekindle-setup-windows-x64
          overwrite: true
          path: dist/T7-Rekindle-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable release archive
        id: portable
        uses: actions/upload-artifact@v7
        with:
          name: T7-Rekindle-portable-windows-x64
          overwrite: true
          path: dist/T7-Rekindle-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-x64
          overwrite: true
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified application package
        uses: actions/download-artifact@v8
        with:
          name: T7-Rekindle-windows-x64
          path: artifacts/package

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: T7-Rekindle-setup-windows-x64
          path: dist

      - name: Name release installer
        run: >-
          Rename-Item -LiteralPath "dist/T7-Rekindle-Setup.exe"
          -NewName "T7-Rekindle-${env:RELEASE_TAG}-Setup.exe"

      - name: Create release archive
        run: >-
          Compress-Archive -Path "artifacts/package/*"
          -DestinationPath "dist/T7-Rekindle-windows-x64-${env:RELEASE_TAG}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          --verify-tag --notes-from-tag --title "$env:RELEASE_TAG"
          -- "$env:RELEASE_TAG" "dist/T7-Rekindle-windows-x64-${env:RELEASE_TAG}.zip"
          "dist/T7-Rekindle-${env:RELEASE_TAG}-Setup.exe"

  mirror:
    name: Mirror published release to R2
    needs: release
    uses: ./.github/workflows/r2-mirror.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  preview:
    name: Publish preview to R2
    needs: build
    if: >-
      ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.deleted }}
    runs-on: windows-2022
    timeout-minutes: 15
    concurrency:
      group: r2-preview-${{ vars.R2_BUCKET }}
      cancel-in-progress: false
      queue: max
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "3"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check out publication scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          architecture: x64

      - name: Download artifacts from the successful build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.installer_id }},${{ needs.build.outputs.portable_id }}
          merge-multiple: true
          path: dist

      - name: Publish and verify preview
        run: python scripts/preview_release.py
