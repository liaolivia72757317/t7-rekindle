[workspace]
members = ["core", "runtime", "ffi", "resources"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
t7r-battle-core = { path = "core" }
t7r-battle-runtime = { path = "runtime" }
t7r-battle-resources = { path = "resources" }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "io-util", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
encoding_rs = "=0.8.42"
quick-xml = "=0.42.0"
sha2 = { version = "=0.11.1", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_Security_Cryptography"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
panic = "unwind"
debug = 1

[profile.dev]
panic = "unwind"
