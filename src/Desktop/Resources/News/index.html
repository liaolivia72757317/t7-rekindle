ound:linear-gradient(135deg,#1b211f,#101517)}.back{border:0;padding:0;background:transparent;color:#bea879;font-size:11px}.article h2{font-size:18px;font-weight:400;color:#e0ca93;line-height:1.5}.article p{line-height:1.9;color:#bcbfb5}.foot{margin-top:9px;font-size:10px;color:#72796f}.banner-mode .news,.banner-mode .article{display:none}.news-mode .hero{display:none}.reading .news{display:none}.reading .article{display:block}@media(max-height:220px){.news{padding-top:9px}.list a{padding:6px 0}.foot{margin-top:5px}}@media(max-width:380px){.hero{padding:22px}.hero h1{font-size:34px}.hero .seal{left:22px}.news{padding-left:14px;padding-right:14px}.title{font-size:12px}}

<script>
(function(){
var stories={

story:["孤骑破阵！演武场上的逆风一局","演武场传来一则趣闻：一位无名骑士在旗阵边缘盘旋许久，终于抓住对方转身的空隙，完成了一次漂亮的突破。围观将士笑称，最锋利的武器，有时是耐心。（本篇为虚构战报。）"],

function show(){var key=location.hash.slice(1),story=stories[key];document.body.className=key==='banner'?'banner-mode':'news-mode';if(story){document.body.className+=' reading';document.getElementById('title').textContent=story[0];document.getElementById('body').textContent=story[1];}}
document.getElementById('back').onclick=function(){location.hash='news';};window.onhashchange=show;show();
})();
